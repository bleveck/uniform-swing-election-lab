name: Check and publish Posit and Shinylive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Read pinned runtime packages
        id: dependencies
        shell: python
        run: |
          import json, os
          with open('manifest.json') as file:
              manifest = json.load(file)
          packages = [f"{name}@{info['description']['Version']}"
                      for name, info in manifest['packages'].items()]
          packages.append('any::testthat')
          packages.append('any::shinylive@0.5.0')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as file:
              file.write('packages=' + ','.join(packages) + '\n')
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: ${{ steps.dependencies.outputs.packages }}
          dependencies: '"hard"'
          install-quarto: 'false'
          install-pandoc: 'false'
      - name: Validate the deployment bundle
        run: Rscript scripts/check_deployment.R
      - name: Run model, data, feed, and Shiny checks
        run: Rscript tests/run_tests.R
      - name: Build browser app with WebAssembly packages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: Rscript scripts/build_shinylive.R
      - name: Upload static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/shinylive-site

  publish-branch:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Advance the branch watched by Posit Connect Cloud
        run: git push origin HEAD:refs/heads/codex/publish

  github-pages:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the browser app
        id: deployment
        uses: actions/deploy-pages@v4

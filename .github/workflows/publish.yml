name: Check app and publish branch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Read pinned runtime packages
        id: dependencies
        shell: python
        run: |
          import json, os
          with open('manifest.json') as file:
              manifest = json.load(file)
          packages = [f"{name}@{info['description']['Version']}"
                      for name, info in manifest['packages'].items()]
          packages.append('any::testthat')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as file:
              file.write('packages=' + ','.join(packages) + '\n')
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: ${{ steps.dependencies.outputs.packages }}
          dependencies: '"hard"'
          install-quarto: 'false'
          install-pandoc: 'false'
      - name: Validate the deployment bundle
        run: Rscript scripts/check_deployment.R
      - name: Run model, data, feed, and Shiny checks
        run: Rscript tests/run_tests.R

  publish-branch:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Advance the branch watched by Posit Connect Cloud
        run: git push origin HEAD:refs/heads/codex/publish
